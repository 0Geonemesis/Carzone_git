<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ventas</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg,#0f172a,#1e293b);
            min-height:100vh;
        }

        .login-container{
            min-height:100vh;
        }

        .card-login{
            border:none;
            border-radius:25px;
            overflow:hidden;
            box-shadow:0 20px 40px rgba(0,0,0,.3);
        }

        .left-side{
            background:linear-gradient(135deg,#2563eb,#1d4ed8);
            color:white;
            padding:50px;
        }

        .left-side h1{
            font-weight:700;
        }

        .icon-shop{
            font-size:5rem;
        }

        .right-side{
            padding:50px;
            background:white;
        }

        .form-control{
            height:50px;
            border-radius:12px;
        }

        .btn-login{
            height:50px;
            border-radius:12px;
            font-weight:600;
        }

        .demo-box{
            background:rgba(255,255,255,.15);
            border-radius:12px;
            padding:15px;
            margin-top:20px;
        }
    </style>

</head>

<body>

<div class="container login-container">

    <div class="row justify-content-center align-items-center h-100">

        <div class="col-lg-10">

            <div class="card card-login">

                <div class="row g-0">

                    <!-- Panel Izquierdo -->

                    <div class="col-md-5 left-side d-flex flex-column justify-content-center">

                        <div class="text-center">

                            <i class="bi bi-cart-check-fill icon-shop"></i>

                            <h1 class="mt-3">
                                Sistema de Ventas
                            </h1>

                            <p>
                                Gestión de productos, ventas y usuarios.
                            </p>

                        </div>

                        <div class="demo-box">

                            <strong>Usuarios de prueba</strong>

                            <hr>

                            <p class="mb-1">
                                <b>Admin:</b> admin / 123
                            </p>

                            <p class="mb-0">
                                <b>Vendedor:</b> vendedor / 123
                            </p>

                        </div>

                    </div>

                    <!-- Panel Derecho -->

                    <div class="col-md-7 right-side">

                        <h2 class="mb-4">
                            Iniciar Sesión
                        </h2>

                        <form>

                            <div class="mb-3">

                                <label class="form-label">
                                    Usuario
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Ingrese usuario">

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Contraseña
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    placeholder="Ingrese contraseña">

                            </div>

                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-login">

                                    <i class="bi bi-box-arrow-in-right"></i>
                                    Ingresar

                                </button>

                            </div>

                        </form>

                        <hr>

                        <div class="text-center">

                            ¿No tienes cuenta?

                            <a href="register.html">
                                Registrarse
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
